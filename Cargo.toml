[workspace]
resolver = "3"
members = [
    "crates/earshot-core",
    "crates/earshot-asr-whisper",
    "crates/earshot-onnx",
    "crates/earshot-net",
    "crates/earshot-proc",
    "crates/earshot-update",
    "crates/earshot-llm",
    "crates/earshot-llm-replay",
    "crates/earshot-llm-local",
    "crates/earshot-store",
    "crates/earshot-sync",
    "crates/earshot-sync-server",
    "crates/earshot-worker",
    "crates/earshot-capture-wasapi",
    "crates/earshot-hardware",
    "crates/earshot-runtime",
    "crates/earshot-cli",
    "apps/desktop/src-tauri",
    "xtask",
]

[workspace.package]
version = "0.4.2"
edition = "2024"
rust-version = "1.99"
publish = false

# Function names in crash logs (T9.1j): the link of the app makes a program database, whose
# public-symbols copy ships (apps/desktop/src-tauri/build.rs). Only this package: `debug` on a
# package with a CMake build would change which configuration the cmake crate picks.
[profile.release.package.earshot-desktop]
debug = "line-tables-only"

# Optimised signal processing in debug and test builds: the echo canceller, delay and
# simulator tests run minutes each unoptimised (13 core tests and 6 xtask `echo_nl` tests
# over 60 s each, measured 2026-11-15). Debug assertions and overflow checks stay on, and
# debug and release give the same canceller results (AGENTS.md 11). Named packages only,
# never "*": the cmake crate picks its configuration from a package's own opt-level.
[profile.dev.package.earshot-core]
opt-level = 2
[profile.dev.package.rustfft]
opt-level = 2
[profile.dev.package.rubato]
opt-level = 2
[profile.dev.package.num-complex]
opt-level = 2
# xtask's own `echo_nl` loops (its tests still ran over 60 s each with only the above).
[profile.dev.package.xtask]
opt-level = 1

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
