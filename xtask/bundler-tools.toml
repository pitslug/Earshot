# The tools Tauri's bundler needs for `cargo xtask build --bundle` (T9.1c, PLAN D23). They are
# build tools on the build host only: nothing here is read by the app, and this file is separate
# from `models/manifest.toml` because that one is embedded in the app.
#
# Left alone the bundler downloads these itself. xtask fetches them from here (size and SHA-256
# checked, resumable), places them where the bundler looks with `bundle.useLocalToolsDir`
# (`<target-dir>\.tauri`, visible to every shell) and runs the bundler with no route to the
# network, so a mismatch fails instead of downloading.
#
# Pinned to what tauri-bundler 2.10.3 (the version `@tauri-apps/cli` 2.12.3 is built with)
# expects. Its checks use the constants named in each `publisher_checksum`; a CLI upgrade changes
# `bundle::CLI_VERSION`, this file and `bundle::NSIS_REQUIRED` in one commit.
#
# Licences (read 2026-11-05 from each archive or repository; part of NSIS's is not permissive, so
# distributing an installer waits on the owner's OK):
# - NSIS: COPYING in the archive: zlib/libpng for the code, bzip2 and CPL-1.0 for those
#   compression modules; the LZMA stub goes into every NSIS installer.
# - nsis_tauri_utils: LICENSE_APACHE-2.0 and LICENSE_MIT in its repository.
# - Vulkan runtime: VulkanRT-License.txt in the archive, read 2026-11-06: MIT and Apache 2.0. Unlike
#   the tools above, its loader ships in the x64 install, with that licence file beside it (T8.4ac,
#   The owner). sdk.lunarg.com served it directly, with no redirect, on 2026-11-06.

sets = ["bundler"]

hosts = ["github.com", "sdk.lunarg.com"]

# Observed 2026-11-05 (curl -IL on every URL below).
redirect_hosts = ["release-assets.githubusercontent.com"]

