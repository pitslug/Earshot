# Model manifest (PLAN.md 3.4). Fetch with `cargo xtask fetch-models --set ci|desktop|all`.
#
# Models are downloaded into EARSHOT_MODELS (default %LOCALAPPDATA%\Earshot\models), checked
# against `size` and `sha256` before they are renamed into place, and extracted when `extract`
# is given. Models are never committed. `url` must be https and its host must be listed in
# `hosts`. Downloads follow HTTP redirects only over https and only to `hosts` or
# `redirect_hosts` (the hosts' own CDNs: Hugging Face LFS/Xet storage under hf.co, GitHub
# release asset storage); every hop is checked. These are the only network destinations of
# fetch-models.
#
# Sets (PLAN D22: tests use only the default models): ci = what tests and
# CI need, default models only (the English ladders' transcription models that ci and
# `accept m2` load, Silero, segmentation, CAM++, ONNX Runtime x64); desktop = the desktop's
# default models (every English-ladder transcription model plus the speech models); choice =
# models the app offers as a user choice but no test, threshold or accept check loads
# (tiny.en, small.en-q5_1, large-v3-turbo and its q5_0, Parakeet 0.6B v3); `cargo test -p
# xtask models` fails if ci or desktop holds a transcription model outside every English
# `[[ladder]]` or a local LLM outside `summary`. cuda = the GPU (CUDA 13) build of ONNX
# Runtime, needed only for `earshot-onnx --features cuda`; eval = candidate models for the
# transcription model evaluation (T6.10e, `model-eval`), never shipped from here (community
# ONNX conversions, pinned; a shipped model is converted from NVIDIA's originals by a script
# in this repo first; the Parakeet defaults are also in ci and desktop as
# development copies, see their artefacts); llm-eval = candidate summary models for the
# summary-quality evaluation (T6.20, `cargo xtask sum-eval`), never ci, never shipped from
# here. summary = the shipped local summary models, chosen by T6.20 (the owner): Qwen 3.5 9B
# (Q4_K_M) by default, Qwen 3.5 4B (Q4_K_M) on machines with less memory (earshot-runtime
# `summary_model`, T6.21b); also in llm-eval, where they were measured. The local LLM tests
# (`earshot-llm-local`, `earshot-runtime` summary) load the 4B from this set, never ci.
# arm64 = ONNX Runtime for Windows ARM64 (the Surface); qnn = arm64 plus the QNN execution
# provider for the Snapdragon NPU; qnn-x64 = the QNN execution provider for x64 (Qualcomm's
# HTP simulator, desktop tests and ahead-of-time compilation). qnn and qnn-x64 carry
# Qualcomm-licensed libraries for development only (see their artefacts); `--set all` fetches
# them too. helpers-x64 and helpers-arm64 = what the app downloads for "Speech helpers" (T9.1f,
# earshot-runtime `catalogue`): Silero, segmentation, CAM++ and that architecture's CPU build
# of ONNX Runtime, never a CUDA or QNN library (T8.4a, T8.4). The app extracts only the
# `[[artefact.extract.member]]` files of an archive, so a file it must keep (a licence) is a
# member.
#
# Checksum provenance (`publisher_checksum`):
# - whisper.cpp: sha256 equals the Hugging Face LFS oid of the file at the pinned commit.
# - Silero VAD: the git blob sha1 of the file at the pinned tag (GitHub contents API).
# - sherpa-onnx assets: GitHub publishes no digest for these assets; the sha256 of the ONNX
#   model was checked against the Hugging Face LFS oid of the same file in the sherpa-onnx
#   author's mirror (csukuangfj/...).
# - ONNX Runtime: the sha256 digest GitHub publishes for the release asset.

sets = ["ci", "desktop", "choice", "cuda", "eval", "arm64", "qnn", "qnn-x64", "llm-eval", "summary", "helpers-x64", "helpers-arm64", "cuda-libraries"]

hosts = [
    "huggingface.co",
    "github.com",
    "raw.githubusercontent.com",
    "developer.download.nvidia.com",
]

# Only redirect targets actually observed are listed. Observed 2026-10-18 (curl -I on every
# manifest URL): huggingface.co/.../resolve/... -> us.aws.cdn.hf.co (the regional host varies,
# hence the wildcard); github.com/.../releases/download/... ->
# release-assets.githubusercontent.com. developer.download.nvidia.com answered HEAD and ranged GET
# of both pinned zips directly, with no redirect (2026-11-06; AkamaiNetStorage, Accept-Ranges:
# bytes, 206 on Range), so it adds no entry here.
redirect_hosts = [
    "*.hf.co",
    "release-assets.githubusercontent.com",
]

