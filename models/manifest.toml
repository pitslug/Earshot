# Transcription model ladders (T6.10e, measured on the desktop 2026-10-23; docs/asr-models.md):
# per backend, best first, each the fallback of the one before when a machine is too slow.
# `english`: models for English meetings; `multilingual`: models that also cover other
# languages (the model check keeps those covering the user's meeting languages). Only
# measured backends are listed; QNN is added when measured (GATE-03). Vulkan (T6.10d) runs
# whisper.cpp only (ONNX Runtime has no Vulkan provider here): its rungs are whisper models.
# Every English rung is a default model (PLAN D22) and in `desktop`; the ones ci and accept m2
# load are in `ci`. Parakeet models are community conversions from `eval` (development copies,
# not shippable until converted from NVIDIA's originals); base.en is the shippable fallback
# today. Multilingual rungs are recommendations the app offers (`choice`), never tested.

[[ladder]]
backend = "cuda"
scope = "english"
models = ["parakeet-tdt-0.6b-v2", "parakeet-tdt-110m", "base.en"]
source = "docs/asr-models.md"

[[ladder]]
backend = "cuda"
scope = "multilingual"
models = ["parakeet-tdt-0.6b-v3", "large-v3-turbo"]
source = "docs/asr-models.md"

[[ladder]]
backend = "vulkan"
scope = "english"
models = ["small.en", "base.en"]
source = "docs/asr-models.md"

[[ladder]]
backend = "vulkan"
scope = "multilingual"
models = ["large-v3-turbo"]
source = "docs/asr-models.md"

[[ladder]]
backend = "qnn"
scope = "english"
models = ["parakeet-tdt-0.6b-v2", "parakeet-tdt-110m"]
source = "docs/asr-models.md"

[[ladder]]
backend = "cpu"
scope = "english"
models = ["parakeet-tdt-0.6b-v2", "parakeet-tdt-110m", "base.en"]
source = "docs/asr-models.md"

[[ladder]]
backend = "cpu"
scope = "multilingual"
models = ["parakeet-tdt-0.6b-v3"]
source = "docs/asr-models.md"


