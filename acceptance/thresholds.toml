# Acceptance thresholds (PLAN.md section 4.2).
#
# Humans own this file. Agents may tighten a threshold after a measured result beats it
# comfortably, but must never loosen one (AGENTS.md rule 4 and section 6.1). If a value
# looks unreachable, stop and ask the owner instead of changing it.
#
# Schema per entry:
#   milestone   = "m<N>"
#   metric      = description from PLAN.md 4.2
#   op          = ">=" | "<=" | "==" | "pass"   ("pass" is a boolean check with no value)
#   value       = number (omitted when op = "pass")
#   unit        = "dB" | "s" | "%" | "points" | "ratio" | "count" | ""
#   provisional = true where PLAN.md 4.2 marks the value (provisional)
#
# Percentages are stored as percent numbers: 6.0 means 6%.
# WER uses Whisper-style English text normalisation. DER uses a 0.25 s collar with overlap scored.

# M1 - Echo canceller

[thresholds."aec.erle_farend"]
milestone = "m1"
metric = "ERLE, far-end-only, after 2 s"
op = ">="
value = 25.0
unit = "dB"
provisional = false

[thresholds."aec.erle_linear"]
milestone = "m1"
metric = "ERLE of linear stage alone, unclipped far-only scenario"
op = ">="
value = 12.0
unit = "dB"
provisional = false

[thresholds."aec.convergence"]
milestone = "m1"
metric = "time to ERLE >= 15 dB from cold start"
op = "<="
value = 1.5
unit = "s"
provisional = false

[thresholds."aec.path_change"]
milestone = "m1"
metric = "recovery to ERLE >= 15 dB after echo path change"
op = "<="
value = 2.0
unit = "s"
provisional = false

[thresholds."aec.doubletalk_sisdr"]
milestone = "m1"
metric = "SI-SDR of output vs clean near-end during double talk at SER 0 (SER -10 informational)"
op = ">="
value = 10.0
unit = "dB"
provisional = true

[thresholds."aec.passthrough"]
milestone = "m1"
metric = "SI-SDR output vs input (the input after the app high-pass when one is configured) when far end silent"
op = ">="
value = 30.0
unit = "dB"
provisional = false

[thresholds."aec.robustness"]
milestone = "m1"
metric = "all of the above hold for delay 0-500 ms and drift +/-200 ppm (stereo convergence at 500 ms bulk delay informational)"
op = "pass"
unit = ""
provisional = false

[thresholds."aec.rtf"]
milestone = "m1"
metric = "real-time factor, release build, one core"
op = "<="
value = 0.02
unit = "ratio"
provisional = false

