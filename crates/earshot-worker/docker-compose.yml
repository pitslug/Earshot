# The summary worker and its model (T11.6, docs/sync.md section 10). It runs beside the relay:
# the relay keeps holding no key, and this worker joins your vault as one more device. Once it
# is paired, whoever controls this host can read every synced meeting. Do not start it if you
# do not want that.
#
# Save this file as docker-compose.yml in a folder of its own (the release names it
# earshot-worker-compose.yml), and run every command below in that folder.
#
# 1. Put a GGUF summary model in ./models as model.gguf (for example the Qwen 3.5 4B file
#    Earshot downloads for summaries on a computer's processor).
# 2. Put a `.env` file beside this one with
#
#      EARSHOT_WORKER_RELAY=https://<your relay's address, as your devices use it>
#      EARSHOT_VERSION=<the Earshot version, or leave it out for latest>
#
# 3. Start it with the model on the processor or on an NVIDIA graphics card:
#
#      docker compose --profile cpu up -d
#      docker compose --profile gpu up -d
#
#    Moving between them is a profile change; the worker is the same. Until it is joined it
#    prints "waiting to join", looks for its vault files every few seconds and its health check
#    says "unhealthy: not_joined"; it sends nothing anywhere meanwhile.
# 4. Show a pairing code on one of your devices (Settings, Sync, "Show a pairing code"), then join
#    the running worker with it (the code is typed, never given as an argument):
#
#      docker exec -it earshot-worker earshot-worker join
#
#    The vault key and token are written to the worker's volume, readable by its user only, and
#    the running worker starts within a few seconds. On your other devices it is listed by its
#    name; choose it under "Another computer" on the Summaries page.
#
# To keep the key in Docker secrets instead of the volume: copy the two files out of the volume
# (vault/key and vault/token), make them owned by uid 10001 and readable by it only
# (chmod 600: the worker refuses a vault file others can read), uncomment the `secrets` blocks,
# and set EARSHOT_WORKER_KEY_FILE and EARSHOT_WORKER_TOKEN_FILE to
# /run/secrets/earshot_vault_key and /run/secrets/earshot_vault_token. Never put either in an
# environment variable. `join` always writes to the volume (a secret is read-only).
#
# If a join fails after the code was taken, or this worker's volume is lost, the vault keeps a
# device that can never sync (it holds nothing and is listed offline): delete the volume
# (docker compose down -v) and join again with a new code.
#
# The model server is the stock llama.cpp image, pinned by digest, on an internal network with
# no route out of this host and a fixed subnet. The worker reaches it as http://llama:8080/v1,
# which counts as its own local model only while `llama` resolves inside that subnet, so it may
# write meetings kept on your computers; the worker reaches the relay over a second, ordinary
# network. Point EARSHOT_WORKER_LLM_URL anywhere else, or rename the service, and that endpoint
# is remote: kept-local meetings are declined and written on the asking device. If you change
# the `model` network's subnet (because it clashes with one of yours), change
# EARSHOT_WORKER_MODEL_SUBNET to the same value, or the model counts as remote.
services:
  earshot-worker:
    image: ghcr.io/pitslug/earshot-worker:${EARSHOT_VERSION:-latest}
    # Named, so step 4's `docker exec` finds it.
    container_name: earshot-worker
    restart: unless-stopped
    profiles: ["cpu", "gpu"]
    environment:
      EARSHOT_WORKER_RELAY: ${EARSHOT_WORKER_RELAY:?set EARSHOT_WORKER_RELAY in .env}
      EARSHOT_WORKER_LLM_URL: http://llama:8080/v1
      EARSHOT_WORKER_LLM_SERVICE: llama
      EARSHOT_WORKER_MODEL_SUBNET: 172.31.250.0/24
      EARSHOT_WORKER_LLM_CONTEXT: "16384"
      EARSHOT_WORKER_NAME: ${EARSHOT_WORKER_NAME:-Earshot server}
      # EARSHOT_WORKER_KEY_FILE: /run/secrets/earshot_vault_key
      # EARSHOT_WORKER_TOKEN_FILE: /run/secrets/earshot_vault_token
    volumes:
      - earshot-worker-data:/data
    # secrets:
    #   - earshot_vault_key
    #   - earshot_vault_token
    # The model first, so the worker's first presence already names it; presence also looks
    # again at every beat, so a model that comes up later is named from then on.
    depends_on:
      llama-cpu:
        condition: service_started
        required: false
      llama-gpu:
        condition: service_started
        required: false
    networks: [model, outside]
    # No ports: the worker only calls out, to the relay and to the model.

  llama-cpu:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:89fe93c2ef53ea2d09ca9f53db8878a8f57bb6b143eb63c76a9c218fb583b392
    restart: unless-stopped
    profiles: ["cpu"]
    command: ["-m", "/models/model.gguf", "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "16384"]
    volumes:
      - ./models:/models:ro
    networks:
      model:
        aliases: [llama]

  llama-gpu:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:22bd49f4cf68236a63c5a187d7d1867ffb08472611ddfbf0392b6842a1b30d44
    restart: unless-stopped
    profiles: ["gpu"]
    command: ["-m", "/models/model.gguf", "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "16384", "--n-gpu-layers", "99"]
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      model:
        aliases: [llama]

networks:
  # The model's network: internal, so the model server cannot reach anything outside this host
  # and nothing outside can reach it.
  model:
    internal: true
    # Fixed, so the worker can tell its model's addresses from any other (keep it equal to
    # EARSHOT_WORKER_MODEL_SUBNET).
    ipam:
      config:
        - subnet: 172.31.250.0/24
  # The worker's way to the relay.
  outside: {}

volumes:
  earshot-worker-data:

# secrets:
#   earshot_vault_key:
#     file: ./secrets/vault-key
#   earshot_vault_token:
#     file: ./secrets/vault-token
