[package]
name = "earshot-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
earshot-core = { path = "../earshot-core" }
# The only HTTP client in shipped crates (PLAN.md 3.9, D14). No default features: no
# system proxy, no HTTP/2, no decompression. TLS is rustls with the ring provider and the
# bundled Mozilla roots, configured in `client.rs` (no native-tls/OpenSSL, no aws-lc).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
url = "2.5.7"
webpki-roots = "1.0.9"

[dev-dependencies]
# `time` for dropping request futures after a timeout (already enabled in the workspace by
# earshot-runtime and earshot-llm-replay, so no feature widening).
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }
