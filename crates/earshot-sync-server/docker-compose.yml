# The sync relay (docs/sync-spec.md section 4). Put a `.env` file beside this one with
#
#   EARSHOT_SYNC_SETUP_SECRET=<at least 24 characters>
#   EARSHOT_VERSION=<the Earshot version, or leave it out for latest>
#
# or give the secret as a Docker secret file and set EARSHOT_SYNC_SETUP_SECRET_FILE to its
# path (/run/secrets/<name>) instead; never both.
#
# then `docker compose up -d`. Updating from a compose file before 0.3.12, whose service was
# `earshot-sync` and image `earshot-sync-server`: use `docker compose up -d --remove-orphans`, which
# replaces the old container and keeps its data (the volume's name has not changed). Put it behind your reverse proxy for TLS; the relay speaks
# plain HTTP on port 8787 and holds only sealed data. Behind the proxy every caller shares
# the proxy's address, so ten failed registrations or pairing attempts by anyone make
# everyone wait a minute.
services:
  earshot-server:
    image: ghcr.io/pitslug/earshot-server:${EARSHOT_VERSION:-latest}
    restart: unless-stopped
    environment:
      EARSHOT_SYNC_SETUP_SECRET: ${EARSHOT_SYNC_SETUP_SECRET:?set EARSHOT_SYNC_SETUP_SECRET in .env}
    volumes:
      - earshot-sync-data:/data
    ports:
      - "8787:8787"

# The data volume keeps its name from before 0.3.12 (when the image was earshot-sync-server):
# a new name would start the relay with an empty database and every device would pair again.
volumes:
  earshot-sync-data:
