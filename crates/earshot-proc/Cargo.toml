[package]
name = "earshot-proc"
description = "Child processes with a deadline, cancellation and a kill-on-close job object (T7.4ga)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# std only. All `unsafe` of this crate is in two files of hand declarations: the Windows job
# object in `src/job_win.rs` (thirteen kernel32 functions and five structures, the three passed
# to Windows by size pinned by tests) and the time-zone reader in `src/zone_win.rs` (T14.67: four
# kernel32 functions and three structures, every layout pinned by tests; advapi32's
# `EnumDynamicTimeZoneInformation` is declared only in its tests). The alternative, `windows-sys` with `Win32_System_JobObjects` and
# the memory call's feature, would add features to the
# windows-sys 0.61 that xtask and the whole workspace already build without it (checked with
# `cargo tree -e features -i windows-sys@0.61.2`, 2026-11-04): harmless for builds (a normal
# dependency unifies the same in every build) but a recompile of a widely shared crate for a few
# declarations. The `windows` crate is not in xtask's graph at all.

[lints]
workspace = true
