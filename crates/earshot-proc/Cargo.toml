[package]
name = "earshot-proc"
description = "Child processes with a deadline, cancellation and a kill-on-close job object (T7.4ga)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# std only. The Windows job object is declared by hand in `src/job_win.rs` (all `unsafe` of
# this crate: five kernel32 functions and two structures, their size pinned by a test). The
# alternative, `windows-sys` with `Win32_System_JobObjects`, would add a feature to the
# windows-sys 0.61 that xtask and the whole workspace already build without it (checked with
# `cargo tree -e features -i windows-sys@0.61.2`, 2026-11-04): harmless for builds (a normal
# dependency unifies the same in every build) but a recompile of a widely shared crate for five
# declarations. The `windows` crate is not in xtask's graph at all.

[lints]
workspace = true
