# Core purity contract (PLAN.md 3.2), enforced by `cargo xtask purity` via
# `cargo clippy -p earshot-core --lib -- -D warnings -F clippy::disallowed_methods
# -F clippy::disallowed_types -F unsafe_code` (an `#[allow]` cannot silence them).
# earshot-core is sans-IO: no files, network, processes, threads, wall clock or env vars.
# Time comes from the `Clock` trait, randomness from a seeded RNG passed in.
# Test code may read fixtures; the lib-only check does not compile `#[cfg(test)]` code,
# and ci's workspace clippy step uses the neutral root clippy.toml (CLIPPY_CONF_DIR).

disallowed-methods = [
    # std::fs
    { path = "std::fs::canonicalize", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::fs::copy", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::fs::create_dir", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::fs::create_dir_all", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::fs::exists", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::fs::hard_link", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::fs::metadata", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::fs::read", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::fs::read_dir", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::fs::read_link", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::fs::read_to_string", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::fs::remove_dir", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::fs::remove_dir_all", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::fs::remove_file", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::fs::rename", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::fs::set_permissions", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::fs::symlink_metadata", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::fs::write", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::fs::File::open", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::fs::File::create", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::fs::File::create_new", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::fs::File::options", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::fs::OpenOptions::new", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    # Windows-only filesystem calls (a `cfg(windows)` item is outside the wasm32 build;
    # these paths resolve only on Windows hosts, which are the only build hosts).
    # `allow-invalid` only silences the "does not refer to a reachable function" config
    # warning on targets where the path cannot resolve (wasm32 clippy of crates that
    # depend on core); on Windows the entry is enforced as before, which
    # `canary_windows_only_fs_and_process_calls_fail_clippy` in xtask/src/purity.rs pins.
    { path = "std::os::windows::fs::symlink_file", reason = "core purity: no filesystem access (PLAN.md 3.2)", allow-invalid = true },
    { path = "std::os::windows::fs::symlink_dir", reason = "core purity: no filesystem access (PLAN.md 3.2)", allow-invalid = true },
    # std::path::Path methods that touch the filesystem
    { path = "std::path::Path::exists", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::path::Path::try_exists", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::path::Path::is_file", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::path::Path::is_dir", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::path::Path::metadata", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::path::Path::symlink_metadata", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::path::Path::canonicalize", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::path::Path::read_dir", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::path::Path::read_link", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    # std::net
    { path = "std::net::TcpStream::connect", reason = "core purity: no network access (PLAN.md 3.2)" },
    { path = "std::net::TcpStream::connect_timeout", reason = "core purity: no network access (PLAN.md 3.2)" },
    { path = "std::net::TcpListener::bind", reason = "core purity: no network access (PLAN.md 3.2)" },
    { path = "std::net::UdpSocket::bind", reason = "core purity: no network access (PLAN.md 3.2)" },
    { path = "std::net::ToSocketAddrs::to_socket_addrs", reason = "core purity: no network access (PLAN.md 3.2)" },
    # std::process
    { path = "std::process::Command::new", reason = "core purity: no processes (PLAN.md 3.2)" },
    { path = "std::process::exit", reason = "core purity: no processes (PLAN.md 3.2)" },
    { path = "std::process::abort", reason = "core purity: no processes (PLAN.md 3.2)" },
    { path = "std::process::id", reason = "core purity: no processes (PLAN.md 3.2)" },
    # std::io process streams
    { path = "std::io::stdin", reason = "core purity: no process streams; take `impl Read`/`impl Write` (PLAN.md 3.2)" },
    { path = "std::io::stdout", reason = "core purity: no process streams; take `impl Read`/`impl Write` (PLAN.md 3.2)" },
    { path = "std::io::stderr", reason = "core purity: no process streams; take `impl Read`/`impl Write` (PLAN.md 3.2)" },
    # std::thread
    { path = "std::thread::spawn", reason = "core purity: no threads; adapters own threading (PLAN.md 3.2)" },
    { path = "std::thread::scope", reason = "core purity: no threads; adapters own threading (PLAN.md 3.2)" },
    { path = "std::thread::Builder::spawn", reason = "core purity: no threads; adapters own threading (PLAN.md 3.2)" },
    { path = "std::thread::Builder::spawn_scoped", reason = "core purity: no threads; adapters own threading (PLAN.md 3.2)" },
    { path = "std::thread::sleep", reason = "core purity: no wall-clock waits; time comes from Clock (PLAN.md 3.2)" },
    # std::time
    { path = "std::time::SystemTime::now", reason = "core purity: time comes from the Clock trait (PLAN.md 3.2)" },
    { path = "std::time::Instant::now", reason = "core purity: time comes from the Clock trait (PLAN.md 3.2)" },
    # std::env
    { path = "std::env::var", reason = "core purity: no env vars; take configuration as arguments (PLAN.md 3.2)" },
    { path = "std::env::vars", reason = "core purity: no env vars; take configuration as arguments (PLAN.md 3.2)" },
    { path = "std::env::var_os", reason = "core purity: no env vars; take configuration as arguments (PLAN.md 3.2)" },
    { path = "std::env::vars_os", reason = "core purity: no env vars; take configuration as arguments (PLAN.md 3.2)" },
    { path = "std::env::args", reason = "core purity: no process environment (PLAN.md 3.2)" },
    { path = "std::env::args_os", reason = "core purity: no process environment (PLAN.md 3.2)" },
    { path = "std::env::current_dir", reason = "core purity: no process environment (PLAN.md 3.2)" },
    { path = "std::env::temp_dir", reason = "core purity: no process environment (PLAN.md 3.2)" },
    { path = "std::env::home_dir", reason = "core purity: no process environment (PLAN.md 3.2)" },
    { path = "std::env::current_exe", reason = "core purity: no process environment (PLAN.md 3.2)" },
    { path = "std::env::set_var", reason = "core purity: no process environment (PLAN.md 3.2)" },
    { path = "std::env::remove_var", reason = "core purity: no process environment (PLAN.md 3.2)" },
    { path = "std::env::set_current_dir", reason = "core purity: no process environment (PLAN.md 3.2)" },
]

disallowed-types = [
    { path = "std::fs::File", reason = "core purity: no filesystem access; take `impl Read` or buffers (PLAN.md 3.2)" },
    { path = "std::fs::OpenOptions", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::fs::DirBuilder", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::fs::ReadDir", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::fs::DirEntry", reason = "core purity: no filesystem access (PLAN.md 3.2)" },
    { path = "std::net::TcpStream", reason = "core purity: no network access (PLAN.md 3.2)" },
    { path = "std::net::TcpListener", reason = "core purity: no network access (PLAN.md 3.2)" },
    { path = "std::net::UdpSocket", reason = "core purity: no network access (PLAN.md 3.2)" },
    { path = "std::process::Command", reason = "core purity: no processes (PLAN.md 3.2)" },
    { path = "std::process::Child", reason = "core purity: no processes (PLAN.md 3.2)" },
    # Windows-only, `allow-invalid` as for the std::os::windows::fs entries above.
    { path = "std::os::windows::process::CommandExt", reason = "core purity: no processes (PLAN.md 3.2)", allow-invalid = true },
    { path = "std::thread::Builder", reason = "core purity: no threads (PLAN.md 3.2)" },
]
