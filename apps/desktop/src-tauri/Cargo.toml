[package]
name = "earshot-desktop"
description = "Earshot desktop app: the Tauri 2 shell around earshot-runtime (T7.1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "earshot"

# The file people see: earshot.exe. The developer tool is earshot-cli.exe.
[[bin]]
name = "earshot"
path = "src/main.rs"

[features]
# Forwarded to the runtime (see its Cargo.toml): CUDA for whisper.cpp, ONNX Runtime and
# llama.cpp; whisper.cpp on Vulkan. The default build is CPU only.
cuda = ["earshot-runtime/cuda"]
onnx-cuda = ["earshot-runtime/onnx-cuda"]
vulkan = ["earshot-runtime/vulkan"]
vulkan-summaries = ["vulkan", "earshot-runtime/vulkan-summaries"]
# Parakeet on the Snapdragon NPU (T8.4f): what the ARM64 app ships with (`xtask::build::
# shipped_features`). The QNN libraries come only from beside the exe (T8.4e), never from the
# models folder.
qnn = ["earshot-runtime/qnn", "earshot-runtime/qnn-installed"]

[build-dependencies]
# Pinned with `=` to match `@tauri-apps/cli` and `@tauri-apps/api` 2.12 in apps/desktop.
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
earshot-core = { path = "../../../crates/earshot-core" }
# The model check child's kill-on-close job object (`check_child::run_child`).
earshot-proc = { path = "../../../crates/earshot-proc" }
earshot-runtime = { path = "../../../crates/earshot-runtime" }
earshot-store = { path = "../../../crates/earshot-store" }
# Tauri 2 with its default features (WebView2 runtime, common controls v6) and `specta` for
# typed commands. No updater, http, shell or opener plugin: the app opens no network
# connection of its own (PLAN.md 3.9); the ci `net` step checks it on the shipped Windows
# targets (`net_guard::SHIPPED_TARGETS`).
tauri = { version = "=2.12.4", features = ["specta", "tray-icon"] }
# The global shortcut and "one Earshot at a time" (T7.5): used from Rust only, so the window's
# capabilities stay `core:default`. Neither opens a network connection.
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-single-instance = "=2.5.5"
# Typed IPC (D8, T7.1). Release candidates: keep tauri-specta, specta and the dev-dependency
# specta-typescript pinned together with `=`.
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
# The model check child's JSON lines (T7.4e; same version as earshot-runtime).
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
# The capture mode and mic role of a live meeting (`host::wasapi_starter`).
earshot-capture-wasapi = { path = "../../../crates/earshot-capture-wasapi" }
# The Anthropic API key in Credential Manager (`src/credentials_win.rs`), the vault folder
# dialog (`src/folder_picker_win.rs`), `src/wer_win.rs` and `src/shutdown_win.rs`: all the app's
# `unsafe`. Same version as
# earshot-capture-wasapi; xtask does not depend on `windows`, so these features never widen
# a crate the running xtask.exe was built from.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    # The Windows Error Reporting opt-out (`src/wer_win.rs`).
    "Win32_System_ErrorReporting",
    # The reason shown while a recording is saved at a restart (`src/shutdown_win.rs`).
    "Win32_System_Shutdown",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    # Notifications (`src/toast_win.rs`): WinRT, safe calls.
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
] }

[dev-dependencies]
# The refusal the update tests name.
earshot-update = { path = "../../../crates/earshot-update" }
# Generates the TypeScript bindings in the drift test (same pin as tauri-specta's).
specta-typescript = "=0.0.12"
# Seeded row ids in tests (same versions as earshot-runtime).
rand_chacha = { version = "0.10.0", default-features = false }
rand_core = { version = "0.10.1", default-features = false }

[lints]
workspace = true
