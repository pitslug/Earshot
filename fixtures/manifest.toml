# Fixture manifest (PLAN.md 4.1). Fetch with `cargo xtask fetch-fixtures --set <sets>`.
#
# Cache artefacts are downloaded into EARSHOT_FIXTURES (default
# %LOCALAPPDATA%\earshot-dev\fixtures) at `path`, checked against `size` and `sha256`, and
# extracted into `extract.into` when present. Repo artefacts are committed files, checked in
# place. `url` must be https and its host must be listed in `hosts`; these are the only network
# destinations of fetch-fixtures (no fixture URL redirects, so `redirect_hosts` is empty and any
# redirect to another host is refused). Licences and attribution: fixtures/LICENSES.md.

sets = ["smoke", "librispeech", "ami", "ami-sum", "ami-dev"]

hosts = [
    "www.openslr.org",
    "groups.inf.ed.ac.uk",
    "raw.githubusercontent.com",
]

redirect_hosts = []

