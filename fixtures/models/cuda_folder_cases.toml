# Shared cases for "this manifest path is inside the CUDA folder" (T8.4ae). The rule exists twice:
# earshot-runtime `catalogue::in_cuda_folder` and xtask `manifest::in_cuda_folder`. Both test suites
# run every case below and must give exactly `inside`, so the two copies follow one rule: the first
# path component that is not empty or `.`, split on `/` and `\`, equals `cuda` without regard to case.

[[case]]
path = "cuda/x.zip"
inside = true

[[case]]
path = "cuda"
inside = true

[[case]]
path = "CUDA/x.zip"
inside = true

[[case]]
path = "Cuda\\x.zip"
inside = true

[[case]]
path = "./cuda/x.zip"
inside = true

[[case]]
path = "cuda/sub/x.zip"
inside = true

[[case]]
path = "archives/cuda/x.zip"
inside = false

[[case]]
path = "cuda.zip"
inside = false

[[case]]
path = "cuda-x/y.zip"
inside = false

[[case]]
path = ""
inside = false

# Retired names (T12.48): `[[cuda_retired]]` entries in a manifest whose summaries part pins only
# `a.dll`. Both parsers (earshot-runtime `Catalogue::cuda_retired_of`, xtask
# `Manifest::validate_cuda`) run every case below and must accept exactly when `ok`: each name a
# plain name (no folder, drive or dot entry), unique without regard to case, and pinned by no part.

[[retired]]
names = ["old.dll"]
ok = true

[[retired]]
names = ["Old64_12.DLL", "notes.txt"]
ok = true

[[retired]]
names = []
ok = true

[[retired]]
names = ["A.DLL"]
ok = false

[[retired]]
names = ["old.dll", "OLD.dll"]
ok = false

[[retired]]
names = ["sub/old.dll"]
ok = false

[[retired]]
names = ["sub\\old.dll"]
ok = false

[[retired]]
names = ["c:old.dll"]
ok = false

[[retired]]
names = [".."]
ok = false

[[retired]]
names = [""]
ok = false
